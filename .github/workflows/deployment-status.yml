  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [rollback-preparation]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get package version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Update issue labels (remove in-progress, add completed)
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ needs.pre-deployment.outputs.issue_number }}');
            
            // Remove in-progress label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'in-progress'
            });
            
            // Add completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            
            console.log(`Updated issue #${issueNumber} labels: removed in-progress, added completed`);

