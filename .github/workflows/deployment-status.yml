      - name: Create compressed rollback package
        id: create-artifact
        run: |
          # Create final artifact directory
          mkdir -p rollback-artifacts
          
          # Copy rollback script if it exists
          if [ -f "rollback.sh" ]; then
            cp rollback.sh rollback-artifacts/
          fi
          
          # Determine package name from current commit
          PACKAGE_NAME="rollback-package-${COMMIT_SHA}"
          
          # Create compressed archive
          tar -czf "${PACKAGE_NAME}.tar.gz" -C rollback-artifacts .
          
          # Calculate SHA256 checksum
          SHA256=$(sha256sum "${PACKAGE_NAME}.tar.gz" | cut -d' ' -f1)
          echo "${SHA256}  ${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
          
          # Export checksum for job outputs
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "artifact-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ Compressed package created: ${PACKAGE_NAME}.tar.gz"
          echo "✅ SHA256: $SHA256"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${COMMIT_SHA}
          path: |
