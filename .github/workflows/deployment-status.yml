   npm run test
   \`\`\`

## Verification Checklist

- [ ] Previous commit verified
- [ ] Dependencies reinstalled
- [ ] Tests passing
- [ ] Application starting correctly
- [ ] Environment variables restored
- [ ] Monitoring systems updated

## Troubleshooting

### Common Issues

1. **Git reset fails**
   - Check that the previous commit exists in local history
   - Run \`git fetch --all\` and try again

2. **Dependency conflicts**
   - Clear npm cache: \`npm cache clean --force\`
   - Delete node_modules and reinstall

3. **Environment issues**
   - Restore from config-backup
   - Update .env with appropriate values

## Support

If you encounter issues during rollback, contact the development team with:
- Rollback error logs
- Current commit SHA
- Previous commit SHA
- Node.js and npm versions

