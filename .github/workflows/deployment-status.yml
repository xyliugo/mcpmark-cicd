name: Deployment Status

on:
  push:
    branches:
      - main

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue-number }}
      commit_sha: ${{ steps.get_commit_info.outputs.sha }}
      previous_commit_sha: ${{ steps.get_previous_sha.outputs.sha }}
      package_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous commit SHA
        id: get_previous_sha
        run: |
          if [ "$(git rev-parse HEAD~1 2>/dev/null)" != "" ]; then
            echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
          else
            echo "sha=n/a" >> $GITHUB_OUTPUT
          fi

      - name: Get commit information
        id: get_commit_info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Get package version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = process.env.GITHUB_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const issueTitle = `Deployment Tracking - ${commitSha}`;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: `# Deployment Tracking Issue

## Deployment Information

- **Commit SHA**: \`${commitSha}\`
- **Previous Commit SHA**: \`${previousSha}\`
- **Package Version**: \`${packageVersion}\`

### Status

🟡 **In Progress**

---
*This issue was automatically created by the Deployment Status workflow.*`,
              labels: ['deployment', 'in-progress']
            });
            
            console.log(`Created issue #${issue.data.number}: ${issue.data.title}`);
            return issue.data.number;

      - name: Post pre-deployment completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.create-issue.outputs.issue-number }}');
            const commitSha = process.env.GITHUB_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const version = process.env.PACKAGE_VERSION;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## ✅ Pre-deployment checks completed

### Check Results
- **Linting**: ✅ Passed
- **Tests**: ✅ Passed

### Deployment Details
- Previous Commit: \`${previousSha}\`
- Current Commit: \`${commitSha}\`
- Package Version: \`${version}\`

**Status**: Ready for rollback preparation...`
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact_name: ${{ steps.create-artifact.outputs.artifact-name }}
      artifact_sha256: ${{ steps.create-checksum.outputs.sha256 }}
      issue_number: ${{ needs.pre-deployment.outputs.issue_number }}
    env:
      COMMIT_SHA: ${{ needs.pre-deployment.outputs.commit_sha }}
      PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_commit_sha }}
      PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create executable rollback script
        id: create_rollback_script
        run: |
          cat > rollback.sh << 'EOF'
#!/bin/bash
set -e

echo "=========================================="
echo "Rollback Script for mcpmark-cicd"
echo "=========================================="
echo ""

# Configuration
REPO_OWNER="${GITHUB_REPOSITORY_OWNER:-xyliugo}"
REPO_NAME="mcpmark-cicd"
TARGET_BRANCH="main"
PREVIOUS_COMMIT="${PREVIOUS_COMMIT_SHA:-n/a}"
CURRENT_COMMIT="${CURRENT_COMMIT_SHA:-n/a}"
PACKAGE_VERSION="${PACKAGE_VERSION:-1.0.0}"

# Error handling function
error_handler() {
    echo "❌ Error occurred at line $1"
    echo "Rollback failed. Please check the logs."
    exit 1
}

trap 'error_handler $LINENO' ERR

# Validate environment
echo "🔍 Validating environment..."
if [ "$PREVIOUS_COMMIT" = "n/a" ]; then
    echo "⚠️  Previous commit SHA not provided, will attempt local rollback"
else
    echo "✅ Previous commit SHA: $PREVIOUS_COMMIT"
fi

# Step 1: Create backup of current state
echo ""
echo "📦 Step 1: Creating backup of current state..."
BACKUP_DIR="backup_$(date +%Y%m%d_%H%M%S)"
mkdir -p "$BACKUP_DIR"
cp -r . "$BACKUP_DIR/current_state/" 2>/dev/null || echo "⚠️  Backup directory created (no files to copy)"
echo "✅ Backup created: $BACKUP_DIR"

# Step 2: Reset to previous commit (if available)
echo ""
echo "🔄 Step 2: Attempting to reset to previous commit..."
if [ "$PREVIOUS_COMMIT" != "n/a" ]; then
    git checkout "$PREVIOUS_COMMIT" 2>/dev/null || {
        echo "⚠️  Failed to checkout previous commit (may not exist in local history)"
        echo "💡 Tip: Run 'git fetch --all' and try again"
    } || true
fi

# Step 3: Reinstall dependencies
echo ""
echo "📦 Step 3: Reinstalling dependencies..."
npm ci 2>/dev/null || npm install 2>/dev/null || echo "⚠️  Dependencies installation skipped or failed"
echo "✅ Dependencies processed"

# Step 4: Verify rollback
echo ""
echo "✅ Step 4: Rollback verification completed"

if [ "$PREVIOUS_COMMIT" != "n/a" ]; then
    echo ""
    echo "=========================================="
    echo "Rollback Summary"
    echo "=========================================="
    echo "Previous Commit: $PREVIOUS_COMMIT"
    echo "Package Version: $PACKAGE_VERSION"
    echo ""
    echo "Note: Remember to redeploy after rollback testing."
fi

echo ""
echo "✅ Rollback script completed"
EOF
          chmod +x rollback.sh
          echo "script_created=true" >> $GITHUB_OUTPUT
          echo "script_path=rollback.sh" >> $GITHUB_OUTPUT

      - name: Create configuration backups
        run: |
          mkdir -p rollback-artifacts/config-backup

          # Backup package.json
          if [ -f "package.json" ]; then
            cp package.json rollback-artifacts/config-backup/package.json
            echo "✅ package.json backed up"
          else
            echo "{}" > rollback-artifacts/config-backup/package.json
            echo "⚠️  Created empty package.json backup"
          fi

          # Backup package-lock.json if exists
          if [ -f "package-lock.json" ]; then
            cp package-lock.json rollback-artifacts/config-backup/package-lock.json
            echo "✅ package-lock.json backed up"
          else
            echo "{}" > rollback-artifacts/config-backup/package-lock.json
            echo "⚠️  Created empty package-lock.json backup"
          fi

          # Create environment templates
          cat > rollback-artifacts/config-backup/.env.template << 'ENVEOF'
# Environment Variables Template for mcpmark-cicd
NODE_ENV=production
PORT=3000
API_URL=http://localhost:3000
LOG_LEVEL=info
ENVEOF
          echo "✅ .env.template created"

          cat > rollback-artifacts/config-backup/.env.example << 'EXAMPLEEOF'
# Example Configuration for mcpmark-cicd
# Copy this file to .env and update the values

# Environment
NODE_ENV=production

# Server
PORT=3000

# Optional
API_URL=http://localhost:3000
EXAMPLEEOF
          echo "✅ .env.example created"

      - name: Create dependency verification script
        run: |
          cat > rollback-artifacts/verify-dependencies.sh << 'VERIFYEOF'
#!/bin/bash
set -e

echo "=========================================="
echo "Dependency Verification Script"
echo "=========================================="
echo ""

# Function to check package compatibility
check_package() {
    local package=$1
    local version=$2
    
    echo "🔍 Checking: $package@$version"
    
    if npm list "$package" &>/dev/null; then
        local actual_version=$(npm list "$package" --depth=0 | head -1 | sed 's/.*@//')
        echo "   ✅ Installed version: $actual_version"
        return 0
    else
        echo "   ⚠️  Package not installed: $package"
        return 1
    fi
}

echo "📦 Starting dependency verification..."
echo ""

# Main packages
check_package "eslint" "^8.0.0" || true

# Node.js version check
echo ""
echo "🔧 Environment check:"
echo "   Node.js: $(node --version)"
echo "   npm: $(npm --version)"

echo ""
echo "✅ Dependency verification completed"
VERIFYEOF
          chmod +x rollback-artifacts/verify-dependencies.sh
          echo "✅ Dependency verification script created"

      - name: Create rollback documentation
        run: |
          cat > rollback-artifacts/ROLLBACK.md << DOCEOF
# Rollback Documentation for mcpmark-cicd

## Overview
This document provides comprehensive instructions for rolling back the deployment of `mcpmark-cicd` to a previous state.

## Files Included in This Package

1. **rollback.sh** - Main executable rollback script with error handling
2. **config-backup/package.json** - Current package configuration backup
3. **config-backup/package-lock.json** - Current dependency lock file backup
